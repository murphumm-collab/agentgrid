x-app-environment: &app-environment
  PROTOCOL_MODE: production
  REQUIRE_FILE_SECRETS: "true"
  DATABASE_URL_FILE: /run/secrets/database_url
  AUTH_SECRET_FILE: /run/secrets/auth_secret
  AUTH_ORIGIN: ${AUTH_ORIGIN:?AUTH_ORIGIN is required}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000

x-app-secrets: &app-secrets
  - database_url
  - auth_secret

x-app: &app
  build:
    context: .
    target: runtime
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: false
  environment: *app-environment
  secrets: *app-secrets
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
  networks: [agentgrid]
  read_only: true
  tmpfs: [/tmp, /app/.next/cache]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentgrid
      POSTGRES_USER: agentgrid
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U agentgrid -d agentgrid"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [agentgrid]
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
    networks: [agentgrid]
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    volumes: [minio_data:/data]
    healthcheck: { test: [CMD, mc, ready, local], interval: 5s, timeout: 3s, retries: 20 }
    networks: [agentgrid]
  migrate:
    <<: *app
    build:
      context: .
      target: worker
    restart: "no"
    command: [node, dist-workers/migrate.js]
  web:
    <<: *app
    environment:
      <<: *app-environment
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      ARTIFACT_MASTER_KEY_FILE: /run/secrets/artifact_master_key
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      ALERT_WEBHOOK_SECRET_FILE: /run/secrets/alert_webhook_secret
      TRUSTED_PROXY_SHARED_SECRET_FILE: /run/secrets/trusted_proxy_shared_secret
      SPEC_ASSISTANT_AI_API_KEY_FILE: /run/secrets/spec_assistant_ai_api_key
    secrets: [database_url, auth_secret, s3_access_key, s3_secret_key, artifact_master_key, admin_api_key, alert_webhook_secret, trusted_proxy_shared_secret, spec_assistant_ai_api_key]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health/ready], interval: 15s, timeout: 5s, retries: 10 }
  indexer:
    <<: *app
    build:
      context: .
      target: worker
    command: [node, dist-workers/indexer.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  coordinator:
    <<: *app
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      PROTOCOL_OPERATOR_PRIVATE_KEY_FILE: /run/secrets/protocol_operator_private_key
    secrets: [database_url, auth_secret, protocol_operator_private_key]
    command: [node, dist-workers/coordinator.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  maintenance:
    <<: *app
    build:
      context: .
      target: worker
    command: [node, dist-workers/maintenance.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  team-formation:
    <<: *app
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      PROTOCOL_OPERATOR_PRIVATE_KEY_FILE: /run/secrets/protocol_operator_private_key
    secrets: [database_url, auth_secret, protocol_operator_private_key]
    command: [node, dist-workers/teamFormation.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  task-evaluator:
    <<: *app
    profiles: [agents]
    build:
      context: .
      target: worker
    command: [node, dist-workers/taskEvaluator.js]
    environment:
      <<: *app-environment
      PROTOCOL_URL: http://web:3000
      AGENT_ID: ${EVALUATOR_AGENT_ID}
      AGENT_API_KEY_FILE: /run/secrets/evaluator_agent_api_key
      AGENT_WALLET_PRIVATE_KEY_FILE: /run/secrets/evaluator_agent_wallet_private_key
    secrets: [database_url, auth_secret, evaluator_agent_api_key, evaluator_agent_wallet_private_key]
    depends_on:
      web: { condition: service_healthy }
  evaluation-expiry:
    <<: *app
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      PROTOCOL_OPERATOR_PRIVATE_KEY_FILE: /run/secrets/protocol_operator_private_key
    secrets: [database_url, auth_secret, protocol_operator_private_key]
    command: [node, dist-workers/evaluationExpiry.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  monitor:
    <<: *app
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      ALERT_WEBHOOK_SECRET_FILE: /run/secrets/alert_webhook_secret
    secrets: [database_url, auth_secret, alert_webhook_secret]
    command: [node, dist-workers/monitor.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  backup:
    <<: *app
    build:
      context: .
      target: ops
    profiles: [ops]
    read_only: false
    volumes: [backups:/backups]
    environment:
      <<: *app-environment
      BACKUP_TRANSPORT: direct
      BACKUP_DIRECTORY: /backups
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-agentgrid-backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_KMS_KEY_ID: ${BACKUP_S3_KMS_KEY_ID:-}
      BACKUP_S3_ACCESS_KEY_FILE: /run/secrets/backup_s3_access_key
      BACKUP_S3_SECRET_KEY_FILE: /run/secrets/backup_s3_secret_key
    secrets: [database_url, auth_secret, backup_s3_access_key, backup_s3_secret_key]
    command: [node, dist-workers/backup.js]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backups:
networks:
  agentgrid:
secrets:
  database_url:
    external: true
    name: ${AGENTGRID_DATABASE_URL_SECRET:-agentgrid_database_url}
  postgres_password:
    external: true
    name: ${AGENTGRID_POSTGRES_PASSWORD_SECRET:-agentgrid_postgres_password}
  auth_secret:
    external: true
    name: ${AGENTGRID_AUTH_SECRET:-agentgrid_auth_secret}
  s3_access_key:
    external: true
    name: ${AGENTGRID_S3_ACCESS_KEY_SECRET:-agentgrid_s3_access_key}
  s3_secret_key:
    external: true
    name: ${AGENTGRID_S3_SECRET_KEY_SECRET:-agentgrid_s3_secret_key}
  artifact_master_key:
    external: true
    name: ${AGENTGRID_ARTIFACT_MASTER_KEY_SECRET:-agentgrid_artifact_master_key}
  admin_api_key:
    external: true
    name: ${AGENTGRID_ADMIN_API_KEY_SECRET:-agentgrid_admin_api_key}
  alert_webhook_secret:
    external: true
    name: ${AGENTGRID_ALERT_WEBHOOK_SECRET:-agentgrid_alert_webhook_secret}
  trusted_proxy_shared_secret:
    external: true
    name: ${AGENTGRID_TRUSTED_PROXY_SHARED_SECRET:-agentgrid_trusted_proxy_shared_secret}
  protocol_operator_private_key:
    external: true
    name: ${AGENTGRID_PROTOCOL_OPERATOR_PRIVATE_KEY_SECRET:-agentgrid_protocol_operator_private_key}
  evaluator_agent_api_key:
    external: true
    name: ${AGENTGRID_EVALUATOR_AGENT_API_KEY_SECRET:-agentgrid_evaluator_agent_api_key}
  evaluator_agent_wallet_private_key:
    external: true
    name: ${AGENTGRID_EVALUATOR_AGENT_WALLET_PRIVATE_KEY_SECRET:-agentgrid_evaluator_agent_wallet_private_key}
  backup_s3_access_key:
    external: true
    name: ${AGENTGRID_BACKUP_S3_ACCESS_KEY_SECRET:-agentgrid_backup_s3_access_key}
  backup_s3_secret_key:
    external: true
    name: ${AGENTGRID_BACKUP_S3_SECRET_KEY_SECRET:-agentgrid_backup_s3_secret_key}
  spec_assistant_ai_api_key:
    external: true
    name: ${AGENTGRID_SPEC_ASSISTANT_AI_API_KEY_SECRET:-agentgrid_spec_assistant_ai_api_key}
